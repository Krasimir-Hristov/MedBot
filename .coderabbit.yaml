# ==============================================================================
# CodeRabbit Configuration for MedBot
# ==============================================================================
version: '2'
language: 'bg-BG'
early_access: false

reviews:
  profile: 'assertive'
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - 'main'
      - 'master'
      - 'production'

  # Общи инструкции за преглед на кода, съобразени с правилата на проекта
  instructions: |
    Вие сте главен софтуерен архитект, ревюиращ двуезичния медицински RAG проект "MedBot" (Български/Гръцки).
    Задължително следете за следните инженерни и архитектурни стандарти:

    1. АРХИТЕКТУРА И NO-MIDDLEWARE ПОЛИТИКА:
       - Стриктно забранено е създаването или използването на `middleware.ts`.
       - Цялата глобална логика, защита и проверка за роли трябва да се извършва в `proxy.ts`, Route Handlers или Server Actions.
       - Защита от CVE-2025-29927: Заглавни части (headers), започващи с `x-` (особено `x-middleware-subrequest`), трябва да се филтрират от клиентските заявки в прокси слоя.
       - Защита в дълбочина (Defense in Depth): Авторизацията трябва да се дублира на ниво Server Components/Server Actions.

    2. REACT & FRONTEND СТАНДАРТИ:
       - ВСИЧКИ React компоненти ЗАДЪЛЖИТЕЛНО се дефинират чрез Arrow Functions:
         Пример: `const MyComponent: React.FC<Props> = () => { ... };`
         Никога да не се използва ключовата дума `function MyComponent()`.
       - Tailwind CSS v4: Използвайте новия синтаксис за градиенти (напр. `bg-linear-to-*`, а не стария `bg-gradient-to-*`).
       - Всички интерактивни елементи трябва да имат `aria-label` за достъпност (A11y).
       - Оптимизация: Използвайте `next/image` за оптимизирано зареждане на статични изображения.

    3. СТРОГ TYPESCRIPT И ОБРАБОТКА НА ГРЕШКИ:
       - Използването на типа `any` е СТРОГО ЗАБРАНЕНО. Използвайте точни интерфейси или `unknown` с Type Guards.
       - ЗАДЪЛЖИТЕЛНИ `try/catch` блокове за абсолютно всички асинхронни операции, API заявки и Server Actions.
       - Никога не връщайте необработени системни грешки или stack traces към клиента. Връщайте приятелски и сигурни съобщения.

    4. СЛОЙ ЗА ДОСТЪП ДО ДАННИ (DAL) И БАЗА ДАННИ:
       - Всички заявки към базата данни трябва да бъдат изолирани в DAL (`src/lib/db/` или отделни DAL модули). Директни SQL/ORM заявки от UI компоненти са забранени.
       - Работата с Neon PostgreSQL се осъществява типизирано чрез Drizzle ORM и схемата в `src/lib/db/schema.ts`.
       - Векторните колони (`embedding`) задължително са с 1536 измерения (`openai/text-embedding-3-small`).

    5. МЕДИЦИНСКА ТОЧНОСТ И ДВУЕЗИЧНОСТ:
       - Проектът обслужва онкологично досие. Отговорите и форматирането на медицински термини на български и гръцки език трябва да са безупречни.
       - Всички цитати на документи в чата на лекаря задължително трябва да са кликаеми връзки във формат: `[📄 Заглавие (Дата)](/api/doc/ID)`.

    6. ДЪЛЖИНА НА ФАЙЛОВЕТЕ И ЧИСТ КОД:
       - Файлове над 300 реда трябва да се препоръчват за разделяне на по-малки модули.
       - Без автоматично генериране на Unit тестове без изрична заявка.

chat:
  auto_reply: true
